<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aufgabenboard - AAM Demo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="kopf">
    <h1>Aufgabenboard</h1>
    <p class="untertitel">AAM Demo &middot; Everlast Consulting</p>
    <form class="neue-karte" id="neue-karte-form">
      <input type="text" id="neue-karte-titel" placeholder="Neue Aufgabe eintragen" autocomplete="off" maxlength="120">
      <div class="farbwahl" role="radiogroup" aria-label="Kartenfarbe">
        <label class="farbe" title="Grau"><input type="radio" name="karten-farbe" value="grau" checked><span class="punkt punkt-grau"></span></label>
        <label class="farbe" title="Blau"><input type="radio" name="karten-farbe" value="blau"><span class="punkt punkt-blau"></span></label>
        <label class="farbe" title="Grün"><input type="radio" name="karten-farbe" value="gruen"><span class="punkt punkt-gruen"></span></label>
        <label class="farbe" title="Gelb"><input type="radio" name="karten-farbe" value="gelb"><span class="punkt punkt-gelb"></span></label>
      </div>
      <button type="submit">Karte anlegen</button>
    </form>
  </header>
  <main class="board" id="board">
    <section class="spalte" data-spalte="zu-erledigen">
      <h2>Zu erledigen</h2>
      <div class="karten" data-karten="zu-erledigen"></div>
    </section>
    <section class="spalte" data-spalte="in-arbeit">
      <h2>In Arbeit</h2>
      <div class="karten" data-karten="in-arbeit"></div>
    </section>
    <section class="spalte" data-spalte="fertig">
      <h2>Fertig</h2>
      <div class="karten" data-karten="fertig"></div>
    </section>
  </main>
  <footer class="fusszeile">
    Übungsprojekt aus dem AAM-Lehrgang. Aufgaben werden nur lokal im eigenen Browser gespeichert, es werden keine Daten an einen Server übertragen.<br>
    Verantwortlich: Everlast Consulting GmbH · <a href="https://www.everlastconsulting.de/impressum">Impressum</a> · <a href="https://www.everlastconsulting.de/datenschutz">Datenschutz</a>
  </footer>
  <script type="module" src="app.js"></script>
</body>
</html>
